
name: Build Ganj Library (Windows 7 SP1 x86)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      QT_VERSION: '5.15.2'
      QT_ARCH: 'win32_mingw81'
      QT_ROOT: 'C:\Qt\5.15.2\mingw81_32'
      MINGW_ROOT: 'C:\Qt\Tools\mingw810_32'

    steps:

      # ---------------------------------------
      # 1. Checkout
      # ---------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Locate project
      # ---------------------------------------

      - name: Locate and extract project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cmake = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Filter 'CMakeLists.txt' -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](build|_build|extracted)[\\/]'
            } |
            Select-Object -First 1

          if (-not $cmake) {

            $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Filter '*.zip' -File -Recurse |
              Select-Object -First 1

            if (-not $zip) {
              throw 'CMakeLists.txt and project ZIP not found.'
            }

            $extractDir = Join-Path $env:GITHUB_WORKSPACE 'extracted'

            New-Item -ItemType Directory -Force `
              -Path $extractDir | Out-Null

            Expand-Archive -Path $zip.FullName `
              -DestinationPath $extractDir -Force

            $cmake = Get-ChildItem -Path $extractDir `
              -Filter 'CMakeLists.txt' -File -Recurse |
              Select-Object -First 1
          }

          if (-not $cmake) {
            throw 'CMakeLists.txt not found.'
          }

          $projectDir = $cmake.DirectoryName

          Write-Host "Project directory: $projectDir"

          if (-not (Test-Path "$projectDir\installer\ganj.iss")) {
            throw 'installer\ganj.iss not found.'
          }

          "PROJECT_DIR=$projectDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---------------------------------------
      # 3. Install build tools
      # ---------------------------------------

      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python --version
          cmake --version

          python -m pip install --upgrade pip
          python -m pip install aqtinstall ninja

      # ---------------------------------------
      # 4. Install Qt and MinGW
      # ---------------------------------------

      - name: Install Qt 5.15.2 and MinGW 8.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m aqt install-qt windows desktop `
            $env:QT_VERSION $env:QT_ARCH -O C:\Qt

          python -m aqt install-tool windows desktop `
            tools_mingw qt.tools.win32_mingw810 -O C:\Qt

          $qt = $env:QT_ROOT
          $mingw = $env:MINGW_ROOT

          $requiredFiles = @(
            "$qt\bin\qmake.exe",
            "$qt\bin\windeployqt.exe",
            "$qt\plugins\platforms\qwindows.dll",
            "$qt\plugins\sqldrivers\qsqlite.dll",
            "$mingw\bin\gcc.exe",
            "$mingw\bin\g++.exe",
            "$mingw\bin\windres.exe",
            "$mingw\bin\objdump.exe"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

          & "$qt\bin\qmake.exe" -query
          & "$mingw\bin\g++.exe" --version

      # ---------------------------------------
      # 5. Configure and build
      # ---------------------------------------

      - name: Configure and build (Release x86)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'

          $mingw = $env:MINGW_ROOT
          $qt = $env:QT_ROOT

          # Normalize paths for CMake.
          # This fixes the invalid \Q escape error.

          $gcc = (Join-Path $mingw 'bin\gcc.exe').Replace('\', '/')
          $gxx = (Join-Path $mingw 'bin\g++.exe').Replace('\', '/')
          $windres = (Join-Path $mingw 'bin\windres.exe').Replace('\', '/')
          $qtPath = $qt.Replace('\', '/')

          $env:PATH = "$mingw\bin;$qt\bin;$env:PATH"

          # Clean previous CMake cache.

          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          # Configure CMake.

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER:FILEPATH=$gcc" `
            "-DCMAKE_CXX_COMPILER:FILEPATH=$gxx" `
            "-DCMAKE_RC_COMPILER:FILEPATH=$windres" `
            "-DCMAKE_PREFIX_PATH:PATH=$qtPath"

          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configuration failed.'
          }

          # Compile project.

          cmake --build build --parallel

          if ($LASTEXITCODE -ne 0) {
            throw 'Project compilation failed.'
          }

          # Check executable.

          $exe = Join-Path (Get-Location) 'build\Ganj.exe'

          if (!(Test-Path $exe)) {
            throw 'Ganj.exe was not generated.'
          }

          # Verify x86 architecture.

          $architecture = & "$mingw\bin\objdump.exe" -f $exe 2>&1 |
            Out-String

          Write-Host $architecture

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect executable architecture.'
          }

          if ($architecture -notmatch 'architecture:\s*i386') {
            throw 'Ganj.exe is not a 32-bit x86 executable.'
          }

          Write-Host 'BUILD SUCCESSFUL - x86'

      # ---------------------------------------
      # 6. Deploy Qt dependencies
      # ---------------------------------------

      - name: Deploy Qt and MinGW dependencies
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'

          $qt = $env:QT_ROOT
          $mingw = $env:MINGW_ROOT

          $env:PATH = "$mingw\bin;$qt\bin;$env:PATH"

          $env:QT_PLUGIN_PATH = "$qt\plugins"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$qt\plugins\platforms"

          $deploy = Join-Path (Get-Location) 'deploy'

          New-Item -ItemType Directory -Force `
            -Path $deploy | Out-Null

          Copy-Item 'build\Ganj.exe' $deploy -Force

          # Deploy Qt dependencies.

          & "$qt\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --sql `
            --no-translations `
            --dir $deploy `
            --plugindir $deploy `
            (Join-Path $deploy 'Ganj.exe')

          if ($LASTEXITCODE -ne 0) {
            throw 'windeployqt deployment failed.'
          }

          # Ensure Windows platform plugin.

          $platform = "$qt\plugins\platforms\qwindows.dll"

          if (!(Test-Path $platform)) {
            throw 'qwindows.dll not found.'
          }

          New-Item -ItemType Directory -Force `
            -Path "$deploy\platforms" | Out-Null

          Copy-Item $platform "$deploy\platforms\qwindows.dll" -Force

          # Ensure SQLite plugin.

          $sqlite = "$qt\plugins\sqldrivers\qsqlite.dll"

          if (!(Test-Path $sqlite)) {
            throw 'qsqlite.dll not found.'
          }

          New-Item -ItemType Directory -Force `
            -Path "$deploy\sqldrivers" | Out-Null

          Copy-Item $sqlite "$deploy\sqldrivers\qsqlite.dll" -Force

          # Configure Qt plugin paths.

          @'
          [Paths]
          Prefix=.
          Plugins=.
          '@ | Set-Content "$deploy\qt.conf" -Encoding ASCII

          # Copy MinGW runtime DLLs.

          $runtimeDLLs = @(
            'libgcc_s_dw2-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll'
          )

          foreach ($dll in $runtimeDLLs) {

            $source = "$mingw\bin\$dll"
            $destination = "$deploy\$dll"

            if (!(Test-Path $source)) {
              throw "MinGW runtime missing: $dll"
            }

            if (!(Test-Path $destination)) {
              Copy-Item $source $destination -Force
            }
          }

          # Copy fonts.

          if (Test-Path 'resources\fonts') {
            Copy-Item 'resources\fonts' "$deploy\fonts" `
              -Recurse -Force
          }

          # Validate deployment.

          $required = @(
            'Ganj.exe',
            'Qt5Core.dll',
            'Qt5Gui.dll',
            'Qt5Widgets.dll',
            'Qt5Sql.dll',
            'platforms\qwindows.dll',
            'sqldrivers\qsqlite.dll',
            'libgcc_s_dw2-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'qt.conf'
          )

          foreach ($file in $required) {

            if (!(Test-Path "$deploy\$file")) {
              throw "Deployment file missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host 'DEPLOYMENT SUCCESSFUL'

          Get-ChildItem $deploy -Recurse |
            Select-Object FullName

      # ---------------------------------------
      # 7. Build installer
      # ---------------------------------------

      - name: Build installer
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'

          choco install innosetup -y --no-progress

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw 'Inno Setup compiler not found.'
          }

          & $iscc 'installer\ganj.iss'

          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup compilation failed.'
          }

          $setup = Join-Path (Get-Location) `
            'dist\GanjLibrarySetup.exe'

          if (!(Test-Path $setup)) {
            throw 'Installer file was not generated.'
          }

          Get-Item $setup |
            Select-Object FullName, Length

          Write-Host 'INSTALLER CREATED SUCCESSFULLY'

      # ---------------------------------------
      # 8. Upload artifact
      # ---------------------------------------

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GanjLibrarySetup-Windows7-x86
          path: ${{ env.PROJECT_DIR }}/dist/GanjLibrarySetup.exe
          if-no-files-found: error
          retention-days: 30
